<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カフェメニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50">
    <header class="bg-yellow-100 shadow px-4 py-10">
        <h1 class="text-yellow-900 text-6xl font-bold">FK CAFE</h1>
        <p class="text-gray-600 text-sm mt-1">八王子の隠れ家カフェ</p>
    </header>
    <main class="max-w-xl mx-auto px-4 py-8"> 
    <section class="mb-8">
         <h2 class="text-4xl font-bold text-gray-800 mb-4">ドリンク</h2>
         <div class="bg-white rounded-lg shadow p-6 mb-4 hover:-translate-y-1 transition-transform border border-black">
            <h3 class="text-2xl font-bold text-gray-900">エスプレッソ</h3>
            <p class="text-gray-600 mt-1">当店おすすめ　マスターの自慢の一杯をどうぞ。</p>
            <p class="text-yellow-900 font-bold mt-2">５５０円</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:-translate-y-1 transition-transform border border-black">
            <h3 class="text-2xl font-bold text-gray-900">ココア</h3>
            <p class="text-gray-600 mt-1">絶妙な甘さが気持ちを落ち着かせます。</p>
            <p class="text-yellow-900 font-bold mt-2">６００円</p>
        </div>
    </section>
    <section class="mb-8">
        <h2 class="text-4xl font-bold text-gray-900 mb-4">フード</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:-translate-y-1 transition-transform border border-black">
            <h3 class="text-2xl font-bold text-gray-900">フレンチトースト</h3>
            <p class="text-gray-600 mt-1">じっくり焼き上げました。</p>
            <p class="text-yellow-900 font-bold mt-2">１１００円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:-translate-y-1 transition-transform border border-black">
            <h3 class="text-2xl font-bold text-gray-900">シフォンケーキ</h3>
            <p class="text-gray-600 mt-1">生クリームと一緒にどうぞ。</p>
            <p class="text-yellow-900 font-bold mt-2">１３００円</p>
        </div>
      </section>
    </main>    
     <footer class="bg-stone-200 text-center py-6 text-gray-300 text-sm">
      <p class="text-gray-600">2026 FK CAFE</p>
    </footer>
  </body>
</html>
</body>
</html>
